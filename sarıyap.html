<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resimleri Sarı Yap</title>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0;
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .kart { background: white; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.1);
            padding: 36px 40px; max-width: 480px; width: 100%; }
        h2 { margin: 0 0 6px; color: #2b579a; font-size: 20px; }
        p { color: #666; font-size: 13px; margin: 0 0 28px; }
        .drop-area { border: 2px dashed #2b579a; border-radius: 10px; padding: 36px 20px;
            text-align: center; cursor: pointer; transition: background 0.2s; color: #555; font-size: 14px; }
        .drop-area:hover, .drop-area.drag-over { background: #eef3fb; }
        .drop-area input { display: none; }
        .drop-icon { font-size: 36px; margin-bottom: 10px; }
        .btn { width: 100%; padding: 13px; border: none; border-radius: 8px; font-size: 15px;
            font-weight: 700; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
        .btn-indir { background: #27ae60; color: white; display: none; }
        .btn-indir:hover { background: #219a52; }
        .status { margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 13px;
            display: none; }
        .status.ok   { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }
        .status.err  { background: #fdf2f2; color: #c0392b; border: 1px solid #f5b7b1; }
        .status.info { background: #eaf4fb; color: #1a5276; border: 1px solid #a9cce3; }
        .onizleme-wrap { margin-top: 20px; display: none; align-items: center; gap: 12px; }
        .onizleme-wrap img { width: 56px; height: 42px; object-fit: cover; border-radius: 6px;
            border: 1.5px solid #ddd; }
        .onizleme-label { font-size: 12px; color: #555; }
        .onizleme-label strong { display: block; color: #333; }
    </style>
</head>
<body>
<div class="kart">
    <h2>🖼️ Resimleri Sarı Yap</h2>
    <p>Word raporundaki büyük resimleri (6cm × 8cm üzeri) sarı yer tutucu ile değiştirir.</p>

    <div class="drop-area" id="dropArea" onclick="document.getElementById('wordInp').click()"
        ondragover="onDrag(event)" ondragleave="offDrag(event)" ondrop="onDrop(event)">
        <div class="drop-icon">📄</div>
        <div id="dropLabel">Word dosyasını buraya sürükleyin veya tıklayın</div>
        <input type="file" id="wordInp" accept=".docx" onchange="onFileSelect(this.files[0])">
    </div>

    <div class="onizleme-wrap" id="onizlemeWrap">
        <img id="sarıOnizleme" alt="Sarı resim">
        <div class="onizleme-label">
            <strong>Yer tutucu resim</strong>
            GitHub'dan yüklendi
        </div>
    </div>

    <button class="btn btn-indir" id="indirBtn" onclick="islemYap()">⬇️ Resimleri Değiştir ve İndir</button>
    <div class="status" id="status"></div>
</div>

<script>
    const EKLENECEK_URL = 'https://raw.githubusercontent.com/Kafeinsiz/Kafeinsiz.github.io/main/Eklenecek.jpg';
    const EMU_PER_CM   = 914400 / 2.54;
    const MIN_W_EMU    = Math.round(8 * EMU_PER_CM);
    const MIN_H_EMU    = Math.round(6 * EMU_PER_CM);

    let globalWordBuffer = null;
    let globalResimData  = null;
    let dosyaAdi = 'rapor';

    // ── Sarı resmi yükle ─────────────────────────────────────────────────────
    fetch(EKLENECEK_URL)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
        .then(buf => {
            globalResimData = buf;
            const img = document.getElementById('sarıOnizleme');
            img.src = EKLENECEK_URL;
            document.getElementById('onizlemeWrap').style.display = 'flex';
        })
        .catch(err => {
            showStatus('⚠️ Sarı resim yüklenemedi: ' + err.message, 'err');
        });

    // ── Dosya seçimi ─────────────────────────────────────────────────────────
    function onFileSelect(file) {
        if (!file) return;
        dosyaAdi = file.name.replace(/\.docx$/i, '');
        document.getElementById('dropLabel').textContent = '✅ ' + file.name;
        const reader = new FileReader();
        reader.onload = e => {
            globalWordBuffer = e.target.result;
            document.getElementById('indirBtn').style.display = 'block';
            showStatus('Dosya yüklendi. "Resimleri Değiştir ve İndir" butonuna basın.', 'info');
        };
        reader.readAsArrayBuffer(file);
    }

    // ── Sürükle-bırak ────────────────────────────────────────────────────────
    function onDrag(e)  { e.preventDefault(); document.getElementById('dropArea').classList.add('drag-over'); }
    function offDrag(e) { document.getElementById('dropArea').classList.remove('drag-over'); }
    function onDrop(e)  { e.preventDefault(); offDrag(e); const f = e.dataTransfer.files[0]; if (f) onFileSelect(f); }

    // ── Resim değiştirme işlemi ───────────────────────────────────────────────
    function islemYap() {
        if (!globalWordBuffer) { showStatus('❌ Önce bir Word dosyası yükleyin.', 'err'); return; }
        if (!globalResimData)  { showStatus('❌ Sarı resim yüklenemedi, internet bağlantınızı kontrol edin.', 'err'); return; }

        try {
            const zip = new PizZip(globalWordBuffer);
            const count = replaceImages(zip);

            const out  = zip.generate({ type: 'blob' });
            const link = document.createElement('a');
            link.href  = URL.createObjectURL(out);
            link.download = dosyaAdi + '_sarı.docx';
            link.click();

            showStatus('✅ Tamamlandı! ' + count + ' resim değiştirildi.', 'ok');
        } catch(err) {
            showStatus('❌ Hata: ' + err.message, 'err');
            console.error(err);
        }
    }

    function replaceImages(zip) {
        const newRId    = 'rIdEklenecek999';
        const newTarget = 'media/eklenecek.jpeg';
        const relType   = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/image';

        // 1) Sarı resmi zip'e ekle
        zip.file('word/' + newTarget, globalResimData);

        // 2) rels dosyasını string olarak güncelle
        const relsPath = 'word/_rels/document.xml.rels';
        const relsFile = zip.file(relsPath);
        if (!relsFile) return 0;
        let relsXml = relsFile.asText();
        if (!relsXml.includes(newRId)) {
            relsXml = relsXml.replace('</Relationships>',
                '<Relationship Id="' + newRId + '" Type="' + relType + '" Target="' + newTarget + '"/></Relationships>');
        }

        // 3) document.xml string üzerinde büyük resimleri değiştir
        let docXml = zip.file('word/document.xml').asText();
        const replacedRIds = new Set();
        let count = 0;

        docXml = docXml.replace(/<w:drawing>([\s\S]*?)<\/w:drawing>/g, function(block) {
            const m = block.match(/wp:extent\s+cx="(\d+)"\s+cy="(\d+)"/);
            if (!m) return block;
            if (parseInt(m[1], 10) < MIN_W_EMU || parseInt(m[2], 10) < MIN_H_EMU) return block;
            return block.replace(/(\w*:?embed=)(["'])([^"']+)(["'])/, function(full, pre, q1, oldId, q2) {
                if (oldId !== newRId) { replacedRIds.add(oldId); count++; }
                return pre + q1 + newRId + q2;
            });
        });

        // 4) Eski büyük resimleri zip'ten sil
        if (replacedRIds.size > 0) {
            const rIdToTarget = {};
            for (const rm of relsXml.matchAll(/Id="([^"]+)"[^>]*Target="([^"]+)"/g)) {
                rIdToTarget[rm[1]] = rm[2];
            }
            replacedRIds.forEach(oldRId => {
                const target = rIdToTarget[oldRId];
                if (!target || (!target.startsWith('media/') && !target.includes('/media/'))) return;
                const zipPath = target.startsWith('media/') ? 'word/' + target : target;
                const stillUsed = docXml.includes('"' + oldRId + '"') || docXml.includes("'" + oldRId + "'");
                if (!stillUsed && zip.file(zipPath)) zip.remove(zipPath);
            });
        }

        zip.file('word/document.xml', docXml);
        zip.file(relsPath, relsXml);
        return count;
    }

    function showStatus(msg, type) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = 'status ' + type;
        el.style.display = 'block';
    }
</script>
</body>
</html>
