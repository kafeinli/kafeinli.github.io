<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>PSI Rapor Otomasyon</title>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --word-color: #2b579a; --manual-color: #e67e22; --success: #27ae60; --bg: #f4f7f6; --warn: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 20px; margin: 0; }



        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); display: flex; flex-direction: column; height: 80vh; }
        .panel-header { padding: 12px 16px; color: white; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-radius: 12px 12px 0 0; gap: 8px; flex-wrap: wrap; }
        .word-header { background: var(--word-color); }
        .manual-header { background: var(--manual-color); }
        .panel-body { padding: 15px; overflow: auto; flex-grow: 1; }
        textarea { width: 100%; height: 80px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 11px; margin-bottom: 10px; resize: none; box-sizing: border-box; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .data-table th { background: #f8f9fa; padding: 10px; border: 1px solid #dee2e6; text-align: left; position: sticky; top: 0; z-index: 10; }
        .data-table td { padding: 8px; border: 1px solid #eee; white-space: nowrap; }
        .idx { background: #f1f3f5; font-weight: bold; width: 30px; text-align: center; }
        .del-col { width: 28px; padding: 0 !important; }
        .del-btn { background: none; border: none; color: #e74c3c; font-size: 13px; font-weight: 700;
            cursor: pointer; padding: 2px 6px; border-radius: 4px; line-height: 1; }
        .del-btn:hover { background: #fdecea; }
        .highlight { font-weight: bold; color: var(--word-color); }

        /* ── Word header controls ── */
        .word-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .taslak-select { padding: 5px 8px; border-radius: 5px; border: 1.5px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.15); color: white; font-size: 12px; outline: none;
            cursor: pointer; max-width: 180px; }
        .taslak-select option { background: #1a3a6b; color: white; }
        .taslak-select optgroup { background: #0f2347; color: #aac4ff; font-style: normal; font-weight: 700; }
        .taslak-select optgroup option { background: #1a3a6b; color: white; font-weight: 400; padding-left: 8px; }
        .taslak-select:disabled { opacity: 0.5; cursor: default; }

        /* ── Manual header controls ── */
        .manual-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .rapor-no-input { padding: 6px 10px; border: 1.5px solid rgba(255,255,255,0.5); border-radius: 5px;
            background: rgba(255,255,255,0.15); color: white; font-size: 12px; font-weight: 500;
            width: 150px; outline: none; transition: border 0.2s; }
        .rapor-no-input::placeholder { color: rgba(255,255,255,0.65); }
        .rapor-no-input:focus { border-color: white; background: rgba(255,255,255,0.25); }
        .checkbox-label { display: flex; align-items: center; gap: 5px; font-size: 11px;
            color: white; cursor: pointer; white-space: nowrap; user-select: none; }
        .checkbox-label input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; accent-color: #fff; }
        .resim-onizleme { display: none; width: 48px; height: 36px; object-fit: cover;
            border-radius: 4px; border: 1.5px solid rgba(255,255,255,0.5);
            margin-left: 2px; vertical-align: middle; }

        .action-bar { background: white; padding: 20px; border-radius: 12px; margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08); text-align: center; }
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 12px; transition: 0.2s; }
        .btn-white { background: white; color: #333; }
        .btn-white:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-success { background: var(--success); color: white; font-size: 16px; padding: 12px 30px; }
        .btn-folder { background: #f39c12; color: white; font-size: 14px; padding: 12px 22px; }
        .btn-folder:hover { background: #d68910; }
        .btn-success:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-msg { font-size: 12px; margin-top: 8px; color: #555; min-height: 18px; }

        /* ── Raporu Düzenle collapsible ── */
        .collapsible-wrap { background: rgba(0,0,0,0.12); border-radius: 8px; margin: 8px 0 0 0; width: 100%; }
        .collapsible-btn { width: 100%; background: none; border: none; color: white; font-size: 12px;
            font-weight: 600; padding: 7px 12px; text-align: left; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; border-radius: 8px; }
        .collapsible-btn:hover { background: rgba(255,255,255,0.1); }
        .collapsible-arrow { transition: transform 0.2s; display: inline-block; }
        .collapsible-body { display: none; padding: 10px 12px 12px; }
        .collapsible-body.open { display: flex; flex-wrap: wrap; gap: 10px; }
        .duzenle-group { display: flex; flex-direction: column; gap: 4px; }
        .duzenle-label { font-size: 11px; color: rgba(255,255,255,0.8); font-weight: 500; }
        .duzenle-select { padding: 5px 8px; border-radius: 5px; border: 1.5px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.15); color: white; font-size: 12px; outline: none;
            cursor: pointer; min-width: 120px; }
        .duzenle-select option { background: #333; color: white; }
        .duzenle-select:focus { border-color: white; }
        .tarih-btn { background: rgba(255,255,255,0.2); border: 1.5px solid rgba(255,255,255,0.4);
            color: white; font-size: 14px; font-weight: 700; width: 26px; height: 26px;
            border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            line-height: 1; padding: 0; transition: background 0.15s; }
        .tarih-btn:hover { background: rgba(255,255,255,0.35); }

        /* ── Uyarı kutusu ── */
        #warnBox { display: none; background: #fff8e1; border: 1.5px solid #f59e0b;
            border-radius: 10px; padding: 16px 20px; margin-top: 16px; text-align: left; font-size: 13px; color: #333; }
        #warnBox strong { color: #b45309; }
        #warnBox .warn-actions { margin-top: 12px; display: flex; gap: 10px; }
        .btn-devam { background: var(--warn); color: white; padding: 8px 18px; border-radius: 5px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-iptal-warn { background: #e5e7eb; color: #333; padding: 8px 18px; border-radius: 5px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
    </style>
</head>
<body>

<!-- Gizli durum elementleri -->

<div class="main-grid">

                                <input type="checkbox" id="tarihAktif" onchange="onTarihAktifChange(this.checked)">

            <button class="btn-devam" id="btnDevam">✅ Devam Et</button>
            <button class="btn-iptal-warn" id="btnIptal" onclick="iptalEt()">İptal</button>
        </div>

</div>

<script>
    const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

    // ── Raporu Düzenle collapsible ────────────────────────────────────────────
    function toggleDuzenle(btn) {
        const body = document.getElementById('duzenleBody');
        const arrow = btn.querySelector('.collapsible-arrow');
        const isOpen = body.classList.toggle('open');
        arrow.style.transform = isOpen ? 'rotate(180deg)' : '';
    }

    // Müşteri/Fabrika seçim verileri — option value'lardan okunur
    // Müşteri: value = ünvan
    // Fabrika: value = "ünvan|adres" formatında

    // Rapordaki "Müşteri" alanını güncelle
    // bulkReplace gibi çalışır: eski değeri bul, yeni değerle değiştir
    // Seçim yapılınca globalWordData'ya geçici olarak kaydedilir
    // executeRevise sırasında uygulanır

    let pendingMusteriUnvan = null;
    let pendingMusteriKisaAd = null;
    let pendingFabrikaUnvan = null;
    let pendingFabrikaAdres = null;
    let pendingTarih = null;      // "gg.aa.yyyy" formatında (gösterim)
    let pendingTarihTire = null;  // "gg-aa-yyyy" formatında (tire ile rapordakiler için)
    let _tarihDate = null;        // Date objesi — +/- için

    // ── Tarih fonksiyonları ───────────────────────────────────────────────────
    function formatTarih(d) {
        const g = String(d.getDate()).padStart(2,'0');
        const a = String(d.getMonth()+1).padStart(2,'0');
        const y = d.getFullYear();
        return g+'.'+a+'.'+y;        // gg.aa.yyyy
    }
    function formatTarihTire(d) {
        const g = String(d.getDate()).padStart(2,'0');
        const a = String(d.getMonth()+1).padStart(2,'0');
        const y = d.getFullYear();
        return g+'-'+a+'-'+y;        // gg-aa-yyyy
    }
    function setPendingTarih(d) {
        pendingTarih     = formatTarih(d);
        pendingTarihTire = formatTarihTire(d);
        document.getElementById('tarihInput').value = pendingTarih;
    }

    function onTarihAktifChange(checked) {
        const input = document.getElementById('tarihInput');
        const cb    = document.getElementById('tarihAktif');
        if (checked) {
            _tarihDate = new Date();
            setPendingTarih(_tarihDate);
            input.style.opacity = '1';
            cb.parentElement.parentElement.style.background = 'rgba(39,174,96,0.15)';
        } else {
            _tarihDate       = null;
            pendingTarih     = null;
            pendingTarihTire = null;
            input.value      = '';
            input.style.opacity = '0.5';
            cb.parentElement.parentElement.style.background = '';
        }
    }

    function tarihGuncelle(delta) {
        if (!document.getElementById('tarihAktif').checked) return;
        if (!_tarihDate) _tarihDate = new Date();
        _tarihDate.setDate(_tarihDate.getDate() + delta);
        setPendingTarih(_tarihDate);
    }

    function onMusteriChange(val) {
        if (!val) {
            pendingMusteriUnvan = null;
            document.getElementById('musteriSelect').style.background = 'rgba(255,255,255,0.15)';
            return;
        }
        // value = "kısaAd|ünvan" formatında
        const parts = val.split('|');
        pendingMusteriKisaAd = parts[0] || null;
        pendingMusteriUnvan  = parts[1] || null;
        document.getElementById('musteriSelect').style.background = 'rgba(39,174,96,0.4)';
    }

    function onFabrikaChange(val) {
        if (!val) {
            pendingFabrikaUnvan = null;
            pendingFabrikaAdres = null;
            document.getElementById('fabrikaSelect').style.background = 'rgba(255,255,255,0.15)';
            return;
        }
        const parts = val.split('|');
        pendingFabrikaUnvan = parts[0] || null;
        pendingFabrikaAdres = parts[1] || null;
        document.getElementById('fabrikaSelect').style.background = 'rgba(39,174,96,0.4)';
    }
    const WP = 'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing';
    const A  = 'http://schemas.openxmlformats.org/drawingml/2006/main';
    const R  = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const EMU_PER_CM = 914400 / 2.54; // 1 cm = 360000 EMU

    let globalWordBuffer = null, globalWordData = null, globalExcelData = null;
    let globalResimData = null;

    const excelMapping = {
        "itemCode":   ["madde kodu", "ürün no", "malzeme kodu"],
        "itemName":   ["madde adı", "ürün adı", "tanım"],
        "barcode":    ["barkod numarası", "barkod", "barcode", "gtin"],
        "shipQty":    ["sevkiyat miktarı", "sevkiyat adedi", "sevk adedi", "adet", "miktar"],
        "orderNo":    ["sipariş numarası", "sas numarası", "sas no", "sipariş no"],
        "sampleSize": ["örneklem miktarı", "örnekleme adedi", "örneklem adedi", "kontrol set adedi", "örneklem"],
        "majorLimit": ["major hata limiti", "majör hata limiti", "kabul edilebilir major hata", "kabul edilebilir majör hata"],
        "minorLimit": ["minör hata limiti", "minor hata limiti", "kabul edilebilir minör hata", "kabul edilebilir minor hata"]
    };

    function escapeHtml(s) {
        return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // ── DOM yardımcıları ──────────────────────────────────────────────────────
    function ch(el, localName) {
        if (!el) return [];
        return Array.from(el.childNodes).filter(n => n.nodeType === 1 && n.localName === localName);
    }
    function all(el, localName) {
        if (!el) return [];
        const result = [];
        (function walk(node) {
            Array.from(node.childNodes).forEach(c => {
                if (c.nodeType !== 1) return;
                if (c.localName === localName) result.push(c);
                walk(c);
            });
        })(el);
        return result;
    }
    function cellText(tc) { return all(tc,'t').map(t=>t.textContent).join('').trim(); }
    function cellTextNS(tc) { return cellText(tc).replace(/\s+/g,''); }
    function tableTextNS(tbl) { return all(tbl,'t').map(t=>t.textContent).join('').replace(/\s+/g,''); }
    function cellParas(tc) {
        if (!tc) return [];
        return ch(tc,'p').map(p=>all(p,'t').map(t=>t.textContent).join('').trim()).filter(v=>v.length>0);
    }
    function runHasMedia(r) {
        let found = false;
        (function walk(node) {
            Array.from(node.childNodes).forEach(c => {
                if (c.nodeType!==1||found) return;
                const n = c.localName;
                if (n==='drawing'||n==='pict'||n==='object'||n==='AlternateContent'||n==='blip') { found=true; return; }
                walk(c);
            });
        })(r);
        return found;
    }
    function findTables(xmlDoc) {
        const bodyEl = all(xmlDoc.documentElement,'body')[0] || xmlDoc.documentElement;
        const tops = ch(bodyEl,'tbl');
        const result = { header:null, adet:null, iscilik:null, ozet:null, ozet2:null };
        tops.forEach(tbl => {
            const txt = tableTextNS(tbl);
            const rows = ch(tbl,'tr');

            // Header: INSPECTION INFORMATION veya Barkod numarası içeriyor
            if (txt.includes('INSPECTIONINFORMATION') || txt.includes('Barkodnumaras')) {
                result.header = tbl; return;
            }

            // Adet tablosu
            if (txt.includes('P.O.Adedi') && txt.includes('ÖrneklemeAdedi')) {
                result.adet = tbl; return;
            }

            // İşçilik tablosu: tek parçalı
            if (txt.includes('HataLimiti:') && txt.includes('ÖrneklemeAdedi:') && txt.includes('MaddeKodu:')) {
                result.iscilik = tbl; return;
            }

            // Özet Format 1: MinörHataLimiti + SiparişNumarası
            // Güvenlik: ilk hücre "Madde Adı" veya "Madde Kodu" olmalı (header değil)
            if (txt.includes('MinörHataLimiti') && txt.includes('SiparişNumarası') && rows.length >= 2) {
                const firstCells = ch(rows[0],'tc');
                const fc = firstCells.length ? cellText(firstCells[0]).replace(/\s+/g,'') : '';
                if (fc.includes('MaddeAdı') || fc.includes('MaddeKodu') || fc.includes('Ürün')) {
                    result.ozet = tbl; return;
                }
            }

            // Özet Format 2: "Kabul edilebilir" minor/major hata sütunları
            // PSI-04 yapısı: "Kabul edilebilir minor hata" + "SiparişNumarası" veya "Sipariş"
            if (rows.length >= 2) {
                const firstCells = ch(rows[0],'tc');
                const fc = firstCells.length ? cellText(firstCells[0]).replace(/\s+/g,'') : '';
                const hasKabul = txt.toLowerCase().includes('kabuledilebilirminorhata') ||
                                 txt.toLowerCase().includes('kabuledilebilirmajor') ||
                                 txt.toLowerCase().includes('kabuledilebilirkritik');
                const hasSiparis = txt.includes('Sipari');
                const isOzetRow = fc.includes('Ürün') || fc.includes('MaddeAdı') || fc.includes('MaddeKodu');
                if (hasKabul && hasSiparis && isOzetRow) {
                    result.ozet2 = tbl; return;
                }
            }
        });
        return result;
    }

    // ── Yazma fonksiyonları ───────────────────────────────────────────────────
    function writePara(p, text, xmlDoc, force) {
        if (!p||!text||(text==='-'&&!force)) return;
        const runs = ch(p,'r');
        let rPrClone = null;
        if (runs.length>0) { const l=ch(runs[0],'rPr'); if (l.length>0) rPrClone=l[0].cloneNode(true); }
        all(p,'r').forEach(r => { if (r.parentNode===p) p.removeChild(r); });
        const nr = xmlDoc.createElementNS(W,'w:r');
        if (rPrClone) nr.appendChild(rPrClone);
        const nt = xmlDoc.createElementNS(W,'w:t');
        nt.setAttribute('xml:space','preserve'); nt.textContent=text;
        nr.appendChild(nt); p.appendChild(nr);
    }
    function writeCell(tc, text, xmlDoc, force) {
        if (!tc||!text||(text==='-'&&!force)) return;
        const paras = ch(tc,'p');
        if (paras.length>0) writePara(paras[0],text,xmlDoc,force);
    }

    // ── Toplu bul-değiştir ────────────────────────────────────────────────────
    function bulkReplace(xmlDoc, oldVal, newVal) {
        if (!oldVal||!newVal||oldVal===newVal||oldVal==='-'||newVal==='-') return 0;
        let count = 0;
        all(xmlDoc.documentElement,'p').forEach(p => {
            const allRuns = ch(p,'r');
            if (!allRuns.length) return;
            const textRuns = allRuns.filter(r=>!runHasMedia(r));
            if (!textRuns.length) return;
            const combined = textRuns.map(r=>all(r,'t').map(t=>t.textContent).join('')).join('');
            if (!combined.includes(oldVal)) return;
            let rPrClone = null;
            const rpl = ch(textRuns[0],'rPr');
            if (rpl.length>0) rPrClone=rpl[0].cloneNode(true);
            textRuns.forEach(r=>{ if(r.parentNode===p) p.removeChild(r); });
            const newText = combined.split(oldVal).join(newVal);
            const nr = xmlDoc.createElementNS(W,'w:r');
            if (rPrClone) nr.appendChild(rPrClone);
            const nt = xmlDoc.createElementNS(W,'w:t');
            nt.setAttribute('xml:space','preserve'); nt.textContent=newText;
            nr.appendChild(nt);
            const pPr = ch(p,'pPr')[0]||null;
            if (pPr&&pPr.nextSibling) p.insertBefore(nr,pPr.nextSibling);
            else { p.appendChild(nr); if(pPr) p.insertBefore(pPr,p.firstChild); }
            count++;
        });
        return count;
    }

    // ── Rapor no tespiti ──────────────────────────────────────────────────────
    function detectRaporNo(xmlDoc) {
        const regex = /([A-Z]{2,4}-\d{2}-\d{2}-\d{4}-\d{4})/;
        for (const p of all(xmlDoc.documentElement,'p')) {
            const text = all(p,'t').map(t=>t.textContent).join('').trim();
            if (text.includes('Rapor No')) { const m=text.match(regex); if(m) return m[1]; }
        }
        for (const tc of all(xmlDoc.documentElement,'tc')) {
            const text = cellText(tc);
            if (text.includes('Rapor No')) { const m=text.match(regex); if(m) return m[1]; }
        }
        return null;
    }

    // ── Resim temizleme ───────────────────────────────────────────────────────
    // EMU eşiği: 6cm yükseklik = 2160000 EMU, 8cm genişlik = 2880000 EMU
    const MIN_H_EMU = Math.round(6 * EMU_PER_CM); // ~2160000
    const MIN_W_EMU = Math.round(8 * EMU_PER_CM); // ~2880000

    function replaceImages(zip) {
        if (!globalResimData) return 0;

        const newRId    = 'rIdEklenecek999';
        const newTarget = 'media/eklenecek.jpeg';
        const relType   = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/image';

        // 1) Yeni resmi zip'e ekle (.jpeg — Content_Types'ta tanımlı)
        zip.file('word/' + newTarget, globalResimData);

        // 2) rels dosyasını STRING olarak güncelle — XMLSerializer YOK
        const relsPath = 'word/_rels/document.xml.rels';
        const relsFile = zip.file(relsPath);
        if (!relsFile) return 0;
        let relsXml = relsFile.asText();

        // Değiştirilecek büyük resimlerin eski rId'lerini topla
        // Bunları silmek için önce document.xml'den tespit edeceğiz
        const replacedRIds = new Set();

        if (!relsXml.includes(newRId)) {
            relsXml = relsXml.replace('</Relationships>',
                '<Relationship Id="' + newRId + '" Type="' + relType + '" Target="' + newTarget + '"/></Relationships>');
        }

        // 3) document.xml'i STRING olarak oku ve büyük resimlerin embed'ini değiştir
        // XMLSerializer KULLANILMAZ — namespace prefix'lerini bozuyor
        let docXml = zip.file('word/document.xml').asText();
        let count = 0;

        docXml = docXml.replace(/<w:drawing>([\s\S]*?)<\/w:drawing>/g, function(block) {
            const m = block.match(/wp:extent\s+cx="(\d+)"\s+cy="(\d+)"/);
            if (!m) return block;
            if (parseInt(m[1], 10) < MIN_W_EMU || parseInt(m[2], 10) < MIN_H_EMU) return block;

            // embed="eskiRId" — prefix ne olursa olsun yakala
            return block.replace(/(\w*:?embed=)(["'])([^"']+)(["'])/, function(full, pre, q1, oldId, q2) {
                if (oldId !== newRId) {
                    replacedRIds.add(oldId); // Silinecek eski rId'yi kaydet
                    count++;
                }
                return pre + q1 + newRId + q2;
            });
        });

        zip.file('word/document.xml', docXml);

        // 4) Eski büyük resimleri ZIP'ten sil — boyutu düşürür
        // replacedRIds: artık kullanılmayan eski rId'ler
        // Bu rId'lerin Target (dosya yolu) bilgisini rels'ten oku ve ZIP'ten sil
        if (replacedRIds.size > 0) {
            // rels'teki tüm Relationship'leri parse et
            const rIdToTarget = {};
            const relMatches = relsXml.matchAll(/Id="([^"]+)"[^>]*Target="([^"]+)"/g);
            for (const rm of relMatches) {
                rIdToTarget[rm[1]] = rm[2];
            }

            replacedRIds.forEach(oldRId => {
                const target = rIdToTarget[oldRId];
                if (!target) return;
                // Sadece resim dosyalarını sil (media klasöründekiler)
                if (!target.startsWith('media/') && !target.includes('/media/')) return;
                // Tam ZIP yolunu bul: "word/media/imageX.jpeg" gibi
                const zipPath = target.startsWith('media/') ? 'word/' + target : target;
                // Başka bir drawing tarafından hâlâ kullanılıyor mu kontrol et
                // (aynı resim birden fazla yerde küçük boyutta da kullanılmış olabilir)
                const rIdStillUsed = docXml.includes('"' + oldRId + '"') || docXml.includes("'" + oldRId + "'");
                if (!rIdStillUsed && zip.file(zipPath)) {
                    zip.remove(zipPath);
                }
            });
        }

        // 5) Güncellenmiş rels'i zip'e yaz
        zip.file(relsPath, relsXml);

        return count;
    }

    function executeRevise(N, statusEl) {
        const btn = document.getElementById('reviseBtn');
        btn.textContent='İşleniyor...'; btn.disabled=true;

        try {
            const zip = new PizZip(globalWordBuffer);
            const xml = zip.file("word/document.xml").asText();
            const xmlDoc = new DOMParser().parseFromString(xml,"text/xml");
            const ex = globalExcelData, wd = globalWordData;
            const log = [];

            // Rapor no
            const raporNoInput = document.getElementById('raporNoInput').value.trim();
            let dosyaAdi = 'taslakrapor';

            // Adım 1: Toplu bul-değiştir
            // Sıra güvenliği: önce rapordaki değerleri placeholder'larla değiştir,
            // sonra placeholder'ları Excel değerleriyle değiştir.
            // Ürün sırası farklı olsa bile çakışma olmaz.
            const siraGuvenlik = document.getElementById('siraGuvenlik').checked;
            let bulkCount = 0;

            if (siraGuvenlik) {
                // Aşama 1: rapordaki değer → benzersiz placeholder
                const placeholders = [];
                for (let i=0;i<N;i++) {
                    const ph = { code: 'SSKODUXX'+i+'XX', name: 'SSADIXX'+i+'XX', barcode: 'SSBARKODXX'+i+'XX' };
                    placeholders.push(ph);
                    if (wd.itemCode[i]&&wd.itemCode[i]!=='-') bulkCount+=bulkReplace(xmlDoc,wd.itemCode[i],ph.code);
                    if (wd.itemName[i]&&wd.itemName[i]!=='-') bulkCount+=bulkReplace(xmlDoc,wd.itemName[i],ph.name);
                    if (wd.barcode[i] &&wd.barcode[i]!=='-')  bulkCount+=bulkReplace(xmlDoc,wd.barcode[i], ph.barcode);
                }
                // Aşama 2: placeholder → Excel değeri
                for (let i=0;i<N;i++) {
                    const ph = placeholders[i];
                    if (ex.itemCode[i]&&ex.itemCode[i]!=='-') bulkReplace(xmlDoc,ph.code,   ex.itemCode[i]);
                    if (ex.itemName[i]&&ex.itemName[i]!=='-') bulkReplace(xmlDoc,ph.name,   ex.itemName[i]);
                    if (ex.barcode[i] &&ex.barcode[i]!=='-')  bulkReplace(xmlDoc,ph.barcode,ex.barcode[i]);
                }
                log.push('✅ Toplu değiştirme (sıra güvenli): '+bulkCount+' paragraf');
            } else {
                for (let i=0;i<N;i++) {
                    if (wd.itemCode[i]&&ex.itemCode[i]&&wd.itemCode[i]!==ex.itemCode[i]) bulkCount+=bulkReplace(xmlDoc,wd.itemCode[i],ex.itemCode[i]);
                    if (wd.itemName[i]&&ex.itemName[i]&&wd.itemName[i]!==ex.itemName[i]) bulkCount+=bulkReplace(xmlDoc,wd.itemName[i],ex.itemName[i]);
                    if (wd.barcode[i]&&ex.barcode[i]&&wd.barcode[i]!==ex.barcode[i]) bulkCount+=bulkReplace(xmlDoc,wd.barcode[i],ex.barcode[i]);
                }
                log.push('✅ Toplu değiştirme: '+bulkCount+' paragraf');
            }

            if (raporNoInput) {
                const mevcut = detectRaporNo(xmlDoc);
                if (mevcut) { const c=bulkReplace(xmlDoc,mevcut,raporNoInput); bulkCount+=c; log.push('✅ Rapor No güncellendi ('+c+' yerde)'); }
                else log.push('⚠️ Mevcut rapor no bulunamadı');
                dosyaAdi = raporNoInput;
            }

            // Adım 2: Konum bazlı güncelleme
            const tbls = findTables(xmlDoc);

            // ── Müşteri / Fabrika / Gözetim yeri — sabit hücre konumuna yaz ─────
            if (tbls.header) {
                const hrows = ch(tbls.header, 'tr');
                const getHCell = (ri, ci) => { const row=hrows[ri]; if(!row) return null; return ch(row,'tc')[ci]||null; };
                if (pendingMusteriUnvan) {
                    const tc = getHCell(2, 1);
                    if (tc) { writePara(ch(tc,'p')[0], pendingMusteriUnvan, xmlDoc); }
                    log.push('✅ Müşteri: ' + pendingMusteriUnvan);
                }
                if (pendingFabrikaUnvan) {
                    const tc = getHCell(3, 1);
                    if (tc) { writePara(ch(tc,'p')[0], pendingFabrikaUnvan, xmlDoc); }
                    log.push('✅ Fabrika: ' + pendingFabrikaUnvan);
                }
                if (pendingFabrikaAdres) {
                    const tc = getHCell(9, 1);
                    if (tc) { writePara(ch(tc,'p')[0], pendingFabrikaAdres, xmlDoc); }
                    log.push('✅ Gözetim yeri: ' + pendingFabrikaAdres);
                }

                // Tarih güncelleme — rapordaki gg.aa.yyyy formatındaki tüm tarihleri değiştir
                // Sadece header tablosunda değil, tüm raporda bulkReplace ile değiştirir
                if (pendingTarih) {
                    // Gözetim Tarihi — Header tablosu Satır 7, Hücre 1
                    // Sabit konuma yaz, rapor genelinde değiştirme yapılmaz
                    const tarihRow = hrows[7];
                    if (tarihRow) {
                        const tarihCells = ch(tarihRow, 'tc');
                        const tarihTC = tarihCells[1] || null;
                        if (tarihTC) {
                            // Mevcut değerin formatını tespit et (noktalı mı, tireli mi?)
                            const mevcutDeger = all(tarihTC,'t').map(t=>t.textContent).join('').trim();
                            const yeniTarih = mevcutDeger.includes('-') ? pendingTarihTire : pendingTarih;
                            writePara(ch(tarihTC,'p')[0], yeniTarih, xmlDoc, true);
                            log.push('✅ Gözetim Tarihi: ' + yeniTarih);
                        }
                    }
                }
            }

            if (tbls.header) {
                const t0rows = ch(tbls.header,'tr');
                const getCell0 = (ri,ci) => { const row=t0rows[ri]; if(!row) return null; return ch(row,'tc')[ci]||null; };
                const orderNoEmpty = (ex.orderNo||[]).every(v=>!v||v==='-');
                [[5,1,'orderNo'],[6,3,'shipQty'],[8,1,'sampleSize'],[8,3,'majorLimit'],[9,3,'minorLimit']].forEach(e => {
                    const tc=getCell0(e[0],e[1]); if(!tc) return;
                    const paras=ch(tc,'p');
                    for (let i=0;i<N;i++) {
                        if (e[2]==='orderNo') {
                            // Sipariş no yoksa "-" yaz, varsa normal güncelle
                            // force=true: '-' değeri de yazılabilsin
                            const val = orderNoEmpty ? '-' : (ex.orderNo[i]||'-');
                            if (paras[i]) writePara(paras[i], val, xmlDoc, true);
                        } else {
                            const val=ex[e[2]][i]; if(!val||val==='-') continue; if(paras[i]) writePara(paras[i],val,xmlDoc);
                        }
                    }
                });
                log.push('✅ Header güncellendi'+(orderNoEmpty?' (Sipariş No: -)':''));
            }

            if (tbls.adet) {
                let m1=0;
                ch(tbls.adet,'tr').forEach(row => {
                    const cells=ch(row,'tc'); if(cells.length<8) return;
                    const rowCode=cellTextNS(cells[0]).replace(/\D/g,''); if(rowCode.length<4) return;
                    for (let i=0;i<N;i++) {
                        if (rowCode!==String(ex.itemCode[i]).replace(/\D/g,'')) continue; m1++;
                        const qty=ex.shipQty[i], smp=ex.sampleSize[i];
                        // Format A: 8 hücre — hücre 1-5 sevkiyat, 6-7 örneklem
                        // Format B: 8 hücre — hücre 1=Adet, 2=Adet(Karton), 3=Paketli, 4=Paketli(K), 5=Sevkiyat, 6=Örneklem(Adet), 7=Örneklem(Karton)
                        // Her iki formatta da hücre 1'e sevkiyat, 6-7'ye örneklem güvenli
                        for (let c=1;c<=5;c++) if(cells[c]&&qty&&qty!=='-') writeCell(cells[c],qty,xmlDoc);
                        for (let c=6;c<=7;c++) if(cells[c]&&smp&&smp!=='-') writeCell(cells[c],smp,xmlDoc);
                    }
                });
                log.push('✅ Adet: '+m1+' satır');
            }

            if (tbls.iscilik) {
                let currentCode=null, m2=0;
                ch(tbls.iscilik,'tr').forEach(row => {
                    const cells=ch(row,'tc'); if(!cells.length) return;
                    const lbl=cellTextNS(cells[0]);
                    if (lbl.startsWith('MaddeKodu:')) currentCode=lbl.replace('MaddeKodu:','').replace(/\D/g,'');
                    if (lbl==='HataLimiti:'&&currentCode) {
                        for (let i=0;i<N;i++) {
                            if (currentCode!==String(ex.itemCode[i]).replace(/\D/g,'')) continue; m2++;
                            if(cells[2]&&ex.majorLimit[i]!=='-') writeCell(cells[2],ex.majorLimit[i],xmlDoc);
                            if(cells[3]&&ex.minorLimit[i]!=='-') writeCell(cells[3],ex.minorLimit[i],xmlDoc);
                        }
                    }
                    if (lbl==='ÖrneklemeAdedi:'&&currentCode) {
                        for (let i=0;i<N;i++) {
                            if (currentCode!==String(ex.itemCode[i]).replace(/\D/g,'')) continue;
                            for (let c=1;c<=3;c++) if(cells[c]&&ex.sampleSize[i]!=='-') writeCell(cells[c],ex.sampleSize[i],xmlDoc);
                        }
                    }
                });
                log.push('✅ İşçilik: '+m2+' eşleşme');
            }

            // ── Parçalı işçilik yapısı ────────────────────────────────────────
            // Bazı raporlarda işçilik tablosu bölünmüş gelir:
            //   Tablo A (1 satır): "Madde Kodu: XXXX" | "Madde Adı: ..."
            //   Tablo B (4 satır): Hata verileri + "Hata Limiti:" + "Örnekleme Adedi:"
            // Bu yapıda Tablo B'de MaddeKodu: satırı yoktur.
            // Çözüm: tüm top-level tabloları sırayla tara,
            // "MaddeKodu:" içeren 1-2 satırlık tabloyu bul,
            // hemen arkasındaki tabloda "HataLimiti:" varsa parçalı işçilik olarak işle.
            (function() {
                const bodyEl = all(xmlDoc.documentElement,'body')[0] || xmlDoc.documentElement;
                const allTbls = ch(bodyEl,'tbl');
                let m2p = 0;
                for (let ti=0; ti<allTbls.length-1; ti++) {
                    const tbl = allTbls[ti];
                    const tblRows = ch(tbl,'tr');
                    // Madde kodu tek satırlık tablo mu?
                    if (tblRows.length > 2) continue;
                    const firstCells = ch(tblRows[0],'tc');
                    if (!firstCells.length) continue;
                    const firstLbl = cellTextNS(firstCells[0]);
                    if (!firstLbl.startsWith('MaddeKodu:')) continue;

                    const maddeCode = firstLbl.replace('MaddeKodu:','').replace(/\D/g,'');
                    if (maddeCode.length < 4) continue;

                    // Sonraki tabloda HataLimiti: ve ÖrneklemeAdedi: var mı?
                    const nextTbl = allTbls[ti+1];
                    const nextTxt = tableTextNS(nextTbl);
                    if (!nextTxt.includes('HataLimiti:') || !nextTxt.includes('ÖrneklemeAdedi:')) continue;
                    // Aynı tablo zaten normal iscilik olarak işlendiyse atla
                    if (nextTbl === tbls.iscilik) continue;

                    // Eşleşen Excel maddesini bul ve güncelle
                    ch(nextTbl,'tr').forEach(row => {
                        const cells=ch(row,'tc'); if(!cells.length) return;
                        const lbl=cellTextNS(cells[0]);
                        if (lbl==='HataLimiti:') {
                            for (let i=0;i<N;i++) {
                                if (maddeCode!==String(ex.itemCode[i]).replace(/\D/g,'')) continue; m2p++;
                                if(cells[2]&&ex.majorLimit[i]!=='-') writeCell(cells[2],ex.majorLimit[i],xmlDoc);
                                if(cells[3]&&ex.minorLimit[i]!=='-') writeCell(cells[3],ex.minorLimit[i],xmlDoc);
                            }
                        }
                        if (lbl==='ÖrneklemeAdedi:') {
                            for (let i=0;i<N;i++) {
                                if (maddeCode!==String(ex.itemCode[i]).replace(/\D/g,'')) continue;
                                for (let c=1;c<=3;c++) if(cells[c]&&ex.sampleSize[i]!=='-') writeCell(cells[c],ex.sampleSize[i],xmlDoc);
                            }
                        }
                    });
                }
                if (m2p>0) log.push('✅ İşçilik (parçalı): '+m2p+' eşleşme');
            })();

            if (tbls.ozet) {
                let m3=0;
                const orderNoEmptyOzet = (ex.orderNo||[]).every(v=>!v||v==='-');
                ch(tbls.ozet,'tr').slice(1).forEach(row => {
                    const cells=ch(row,'tc'); if(cells.length<9) return;
                    const rowCode=cellTextNS(cells[1]).replace(/\D/g,''); if(rowCode.length<4) return;
                    for (let i=0;i<N;i++) {
                        if (rowCode!==String(ex.itemCode[i]).replace(/\D/g,'')) continue; m3++;
                        const sno = orderNoEmptyOzet ? '-' : ex.orderNo[i];
                        [[2,sno],[3,ex.shipQty[i]],[4,ex.sampleSize[i]],[6,ex.minorLimit[i]],[8,ex.majorLimit[i]]].forEach(u=>{
                            if(cells[u[0]]&&u[1]) writeCell(cells[u[0]],u[1],xmlDoc, u[0]===2 && orderNoEmptyOzet);
                        });
                    }
                });
                log.push('✅ Özet: '+m3+' satır');
            }

            if (tbls.ozet2) {
                let m4=0;
                const orderNoEmptyOzet2 = (ex.orderNo||[]).every(v=>!v||v==='-');
                ch(tbls.ozet2,'tr').slice(1).forEach(row => {
                    const cells=ch(row,'tc'); if(cells.length<8) return;
                    const rowCode=cellTextNS(cells[1]).replace(/\D/g,''); if(rowCode.length<4) return;
                    for (let i=0;i<N;i++) {
                        if (rowCode!==String(ex.itemCode[i]).replace(/\D/g,'')) continue; m4++;
                        const sno2 = orderNoEmptyOzet2 ? '-' : ex.orderNo[i];
                        [[0,ex.itemName[i]],[2,sno2],[3,ex.shipQty[i]],[4,ex.sampleSize[i]],[5,ex.minorLimit[i]],[7,ex.majorLimit[i]]].forEach(u=>{
                            if(cells[u[0]]&&u[1]) writeCell(cells[u[0]],u[1],xmlDoc, u[0]===2 && orderNoEmptyOzet2);
                        });
                    }
                });
                log.push('✅ Özet (F2): '+m4+' satır');
            }

            // Güncel xmlDoc'u zip'e yaz
            zip.file("word/document.xml", new XMLSerializer().serializeToString(xmlDoc));

            // Adım 3: Resim temizleme
            if (document.getElementById('resimTemizle').checked) {
                const imgCount = replaceImages(zip);
                log.push('✅ Resim değiştirildi: '+imgCount+' adet');
            }

            // ── Yazar bilgisini güncelle (docProps/core.xml) ─────────────────
            const coreFile = zip.file('docProps/core.xml');
            if (coreFile) {
                let coreXml = coreFile.asText();
                coreXml = coreXml.replace(/<dc:creator>[^<]*<\/dc:creator>/, '<dc:creator>Enes Arslantürk</dc:creator>');
                coreXml = coreXml.replace(/<cp:lastModifiedBy>[^<]*<\/cp:lastModifiedBy>/, '<cp:lastModifiedBy>Enes Arslantürk</cp:lastModifiedBy>');
                if (!coreXml.includes('<dc:creator>')) {
                    coreXml = coreXml.replace('</cp:coreProperties>', '<dc:creator>Enes Arslantürk</dc:creator></cp:coreProperties>');
                }
                zip.file('docProps/core.xml', coreXml);
            }

            // İndir
            const out = zip.generate({ type:"blob" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(out);
            a.download = dosyaAdi + '.docx';
            a.click();

            const prev = statusEl.textContent;
            statusEl.textContent = (prev && !prev.includes('İşleniyor') ? prev+' | ' : '') + log.join(' | ');
        } catch(err) {
            statusEl.textContent='❌ Hata: '+err.message;
            console.error(err);
        } finally {
            btn.textContent='🔄 Raporu Güncelle'; btn.disabled=false;
        }
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function renderToTable(targetId, data, colorClass) {
        const body = document.getElementById(targetId);
        const rCount = Math.max(...Object.values(data).map(a=>a.length));
        const rows = [];
        for (let i=0;i<rCount;i++) {
            const delBtn = targetId === 'manualBody'
                ? '<td class="del-col"><button class="del-btn" onclick="deleteExcelRow('+i+')" title="Satırı sil">✕</button></td>'
                : '';
            rows.push('<tr>'+
                delBtn+
                '<td class="idx">'+(i+1)+'</td>'+
                '<td class="'+colorClass+'">'+escapeHtml(data.itemCode[i]||"-")+'</td>'+
                '<td>'+escapeHtml(data.itemName[i]||"-")+'</td>'+
                '<td>'+escapeHtml(data.barcode[i]||"-")+'</td>'+
                '<td>'+escapeHtml(data.shipQty[i]||"-")+'</td>'+
                '<td>'+escapeHtml(data.orderNo[i]||"-")+'</td>'+
                '<td>'+escapeHtml(data.sampleSize[i]||"-")+'</td>'+
                '<td>'+escapeHtml(data.majorLimit[i]||"-")+'</td>'+
                '<td>'+escapeHtml(data.minorLimit[i]||"-")+'</td>'+
                '</tr>');
        }
        body.innerHTML = rows.join('');
    }

    function deleteExcelRow(idx) {
        if (!globalExcelData) return;
        // globalExcelData'dan o indeksi sil
        Object.keys(globalExcelData).forEach(key => {
            if (Array.isArray(globalExcelData[key])) {
                globalExcelData[key].splice(idx, 1);
            }
        });
        // Tabloyu yeniden çiz
        renderToTable('manualBody', globalExcelData, 'highlight');
    }
</script>
